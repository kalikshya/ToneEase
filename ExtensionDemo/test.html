<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToneEase - Local Test App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-wrapper {
            width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .chat-header {
            background: #4B2E2B;
            color: #E3DBBB;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #C08552;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: white;
        }

        .chat-name {
            font-size: 15px;
            font-weight: 600;
        }

        .chat-status {
            font-size: 11px;
            color: #AEB784;
            margin-top: 1px;
        }

        .chat-messages {
            height: 360px;
            overflow-y: auto;
            padding: 16px;
            background: #FFF8F0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.received {
            background: white;
            color: #333;
            align-self: flex-start;
            border: 1px solid #E3DBBB;
        }

        .message.sent {
            background: #C08552;
            color: white;
            align-self: flex-end;
        }

        .hint {
            text-align: center;
            font-size: 11px;
            color: #8C5A3C;
            padding: 8px;
            background: #F8F3E1;
            border-top: 1px solid #E3DBBB;
        }

        .chat-input-area {
            padding: 12px 14px;
            border-top: 1px solid #E3DBBB;
            background: #F8F3E1;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #E3DBBB;
            border-radius: 20px;
            font-size: 13px;
            font-family: inherit;
            resize: none;
            outline: none;
            background: white;
            color: #4B2E2B;
            min-height: 42px;
            max-height: 100px;
        }

        .chat-input:focus {
            border-color: #C08552;
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #C08552;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: #8C5A3C;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }
    </style>
</head>
<body>

<div class="page">
    <div class="chat-wrapper">

        <div class="chat-header">
            <div class="chat-avatar">JD</div>
            <div>
                <div class="chat-name">John Doe</div>
                <div class="chat-status">online</div>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message received">Hey! How's the project going?</div>
            <div class="message sent">It's going well, almost done!</div>
            <div class="message received">Great! Let me know if you need help.</div>
        </div>

        <div class="hint"> ToneEase is watching-type a harsh message and wait.</div>

        <div class="chat-input-area">
            <textarea
                class="chat-input"
                id="toneease-test-input"
                placeholder="Type a message..."
                rows="1"
            ></textarea>
            <button class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
                </svg>
            </button>
        </div>

    </div>
</div>

<script>
    const input = document.getElementById("toneease-test-input");
    const sendBtn = document.getElementById("sendBtn");
    const chatMessages = document.getElementById("chatMessages");

    input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = input.scrollHeight + "px";
    });

    sendBtn.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        const msg = document.createElement("div");
        msg.className = "message sent";
        msg.textContent = text;
        chatMessages.appendChild(msg);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        input.value = "";
        input.style.height = "auto";
    }
</script>

</body>
</html>

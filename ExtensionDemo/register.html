<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ToneEase - Register</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 360px;
        }
        h1 { font-size: 22px; color: #0077B6; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #666; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus { border-color: #0077B6; }
        .btn {
            width: 100%;
            padding: 11px;
            background: #0077B6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn:hover { background: #005f8e; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }
        .message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .message.success { background: #e8f5e9; color: #2e7d32; display: block; }
        .message.error { background: #ffebee; color: #c62828; display: block; }
        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }
        .footer-link a { color: #0077B6; text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>ToneEase</h1>
        <p class="subtitle">Create your account</p>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username" />
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password" />
        </div>

        <button class="btn" id="registerBtn">Create Account</button>

        <div class="message" id="message"></div>

        <div class="footer-link">
            Already have an account? <a href="login.html">Sign in here</a>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        function showMessage(text, type) {
            const el = document.getElementById("message");
            el.textContent = text;
            el.className = `message ${type}`;
        }

        document.getElementById("registerBtn").addEventListener("click", async () => {
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const btn = document.getElementById("registerBtn");

            if (!username || !email || !password) {
                showMessage("Please fill in all fields.", "error");
                return;
            }

            if (password.length < 6) {
                showMessage("Password must be at least 6 characters.", "error");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Creating account...";

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password })
                });

                const result = await response.json();

                if (result.status === "success") {
                    // Save user info to chrome storage
                    chrome.storage.local.set({
                        user_id: result.user_id,
                        username: result.username,
                        email: email,
                        is_logged_in: true
                    }, async () => {
                        // Link anonymous session to this new user
                        chrome.storage.local.get(["session_id"], async (data) => {
                            if (data.session_id) {
                                await fetch(`${API_URL}/link-session`, {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({
                                        session_id: data.session_id,
                                        user_id: result.user_id
                                    })
                                });
                            }
                            showMessage("Account created! You can close this tab.", "success");
                            setTimeout(() => window.close(), 1500);
                        });
                    });
                } else {
                    showMessage(result.detail || result.error || "Registration failed.", "error");
                }
            } catch (error) {
                showMessage("Cannot connect to backend. Make sure it's running!", "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Create Account";
            }
        });

        // Allow Enter key to submit
        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") document.getElementById("registerBtn").click();
        });
    </script>
</body>
</html>

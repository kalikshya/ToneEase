<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ToneEase</title>
    <link rel="stylesheet" href="popup.css" />
</head>
<body>

    <div class="container">

        <h1>ToneEase</h1>
        <p class="subtitle">Smart Tone Assistant</p>

        <!-- USER BAR - shown when logged in -->
        <div class="user-bar" id="userBar">
            <span>&#128100; <span class="username" id="usernameDisplay"></span></span>
            <button class="logout-btn" id="logoutBtn">Sign out</button>
        </div>

        <!-- LOGIN BAR - shown when not logged in -->
        <div class="login-bar" id="loginBar">
            <span>Guest mode — history not saved</span>
            <button class="login-btn" id="loginBtn">Sign In</button>
        </div>

        <!-- MASTER TOGGLE -->
        <div class="section">
            <span>ToneEase Status</span>
            <label class="switch">
                <input type="checkbox" id="masterToggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <!-- AUTOMATIC MODE -->
        <div class="section">
            <span>Automatic Mode</span>
            <label class="switch">
                <input type="checkbox" id="autoMode" checked>
                <span class="slider"></span>
            </label>
        </div>

        <!-- MANUAL MODE -->
        <div class="section">
            <span>Manual Mode</span>
            <label class="switch">
                <input type="checkbox" id="manualMode">
                <span class="slider"></span>
            </label>
        </div>

        <!-- PREFERRED TONE (Hidden by default, shows when manual is on) -->
        <div class="section hidden" id="toneSelectBox">
            <label>Preferred Tone</label>
            <select id="toneSelect">
                <option value="polite">Polite</option>
                <option value="kind">Kind</option>
                <option value="friendly">Friendly</option>
                <option value="professional">Professional</option>
                <option value="confident">Confident</option>
            </select>
        </div>

        <!-- SENSITIVITY -->
        <div class="section sensitivity-container">
            <span>Sensitivity</span>
        </div>

        <input
            type="range"
            min="1"
            max="100"
            value="50"
            id="sensitivity"
            class="sensitivity-slider"
        >

        <div class="sensitivity-labels">
            <span>Low</span>
            <span>Medium</span>
            <span>High</span>
        </div>

        <!-- Test Mode (collapsible) -->
        <div class="section test-toggle-section">
            <span>Test Mode</span>
            <label class="switch">
                <input type="checkbox" id="testModeToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div id="testSection" class="test-section hidden">
            <label class="test-label">Test Message:</label>
            <textarea
                id="testInput"
                class="test-input"
                placeholder="Type a message to test tone detection..."
            ></textarea>
            <button id="analyzeBtn" class="analyze-btn">Analyze Tone</button>
            <p id="statusMessage" class="status-message"></p>
        </div>

        <!-- SUGGESTION BOX -->
        <div class="suggestion-box hidden" id="suggestionBox">
            <div class="suggestion-title">Suggestion</div>
            <div class="suggestion-text">
                <strong>Original:</strong>
                <p id="originalText"></p>
            </div>
            <div class="suggestion-text">
                <strong>Rewritten:</strong>
                <p id="rewrittenText"></p>
            </div>
            <div class="suggestion-actions">
                <button class="apply-btn">Apply</button>
                <button class="reject-btn">Reject</button>
            </div>
        </div>

        <!-- SETTINGS -->
        <div class="footer">
            <span id="settingsBtn">Settings</span>
        </div>

    </div>

    <script src="popup.js"></script>
</body>
</html>

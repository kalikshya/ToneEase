<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ToneEase</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: #f0f8ff;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .user-bar .username { color: #0077B6; font-weight: 600; }
        .user-bar .logout-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 11px;
            text-decoration: underline;
        }
        .login-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: #fff8e1;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #666;
        }
        .login-bar .login-btn {
            background: #0077B6;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>ToneEase</h1>
        <p class="subtitle">Smart Tone Assistant</p>

        <!-- USER BAR - shown when logged in -->
        <div class="user-bar" id="userBar" style="display:none;">
            <span>👤 <span class="username" id="usernameDisplay"></span></span>
            <button class="logout-btn" id="logoutBtn">Sign out</button>
        </div>

        <!-- LOGIN BAR - shown when not logged in -->
        <div class="login-bar" id="loginBar" style="display:none;">
            <span>Guest mode — history not saved</span>
            <button class="login-btn" id="loginBtn">Sign In</button>
        </div>

        <!-- MASTER TOGGLE -->
        <div class="section">
            <span>ToneEase Status</span>
            <label class="switch">
                <input type="checkbox" id="masterToggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <!-- AUTOMATIC MODE -->
        <div class="section">
            <span>Automatic Mode</span>
            <label class="switch">
                <input type="checkbox" id="autoMode" checked>
                <span class="slider"></span>
            </label>
        </div>

        <!-- MANUAL MODE -->
        <div class="section">
            <span>Manual Mode</span>
            <label class="switch">
                <input type="checkbox" id="manualMode">
                <span class="slider"></span>
            </label>
        </div>

        <!-- PREFERRED TONE (Hidden by default) -->
        <div class="section hidden" id="toneSelectBox">
            <label>Preferred Tone</label>
            <select id="toneSelect">
                <option value="polite">Polite</option>
                <option value="kind">Kind</option>
                <option value="friendly">Friendly</option>
                <option value="professional">Professional</option>
                <option value="confident">Confident</option>
            </select>
        </div>

        <!-- SENSITIVITY -->
        <div class="section sensitivity-container">
            <span>Sensitivity</span>
        </div>

        <input 
            type="range" 
            min="1" 
            max="100" 
            value="50" 
            id="sensitivity"
            class="sensitivity-slider"
        >

        <div class="sensitivity-labels">
            <span>Low</span>
            <span>Medium</span>
            <span>High</span>
        </div>

        <!-- Test Input Section -->
        <div id="testSection" style="margin: 15px 0; padding: 15px; background: #f5f5f5; border-radius: 8px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Test Message:</label>
            <textarea 
                id="testInput" 
                placeholder="Type a message to test tone detection..."
                style="width: 100%; height: 80px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; resize: vertical; font-family: inherit;"
            ></textarea>
            <button 
                id="analyzeBtn" 
                style="margin-top: 8px; padding: 8px 16px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;"
            >
                Analyze Tone
            </button>
        </div>

        <!-- SUGGESTION BOX -->
        <div class="suggestion-box hidden" id="suggestionBox">

            <div class="suggestion-title">Suggestion</div>

            <div class="suggestion-text">
                <strong>Original:</strong>
                <p id="originalText"></p>
            </div>

            <div class="suggestion-text">
                <strong>Rewritten:</strong>
                <p id="rewrittenText"></p>
            </div>

            <div class="suggestion-actions">
                <button class="apply-btn">Apply</button>
                <button class="reject-btn">Reject</button>
            </div>

        </div>

        <!-- SETTINGS -->
        <div class="footer">
            <span id="settingsBtn">Settings</span>
        </div>

    </div>

    <script src="popup.js"></script>
</body>
</html>
